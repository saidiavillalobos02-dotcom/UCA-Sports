<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#5f31c5">
  <meta name="description" content="UCA SPORTS: reserva canchas, inscríbete a clases y eventos del Polideportivo UCA.">
  <title>UCA SPORTS</title>

  <!-- Tipografía de la marca: Host Grotesk -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Íconos de Google: Material Symbols (Rounded) -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0..1,0&display=block" rel="stylesheet">

  <!-- Estilos (ordenados de lo general a lo particular).
       El "?v=9" es la versión: súbelo cuando cambies algo, así el navegador
       no muestra una copia vieja guardada. -->
  <link rel="stylesheet" href="css/base.css?v=9">
  <link rel="stylesheet" href="css/componentes.css?v=9">
  <link rel="stylesheet" href="css/pantallas.css?v=9">
</head>
<body>
  <!-- En computadora se ve dentro de un marco de celular; en celular ocupa toda la pantalla -->
  <div class="marco-telefono">
    <main id="app" class="app" aria-live="polite"></main>
  </div>

  <noscript>Para ver el prototipo de UCA SPORTS necesitas activar JavaScript.</noscript>

  <!-- Scripts sin módulos para que también abra haciendo doble clic en el archivo.
       El "?v=9" cumple la misma función que en los estilos. -->
  <script src="js/datos.js?v=9"></script>
  <script src="js/componentes.js?v=9"></script>
  <script src="js/app.js?v=9"></script>
  <script src="js/pantallas.js?v=9"></script>
  <script src="js/pantallas-acceso.js?v=9"></script>
  <script src="js/pantallas-estudiante.js?v=9"></script>
  <script src="js/pantallas-reserva.js?v=9"></script>
  <script src="js/pantallas-comunidad.js?v=9"></script>
  <script src="js/pantallas-tutorias.js?v=9"></script>
  <script src="js/pantallas-perfil.js?v=9"></script>
</body>
</html>
